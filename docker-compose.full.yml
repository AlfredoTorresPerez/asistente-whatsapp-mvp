# =============================================================================
# ASISTENTE WHATSAPP MVP - STACK ALTERNATIVO "FULL" (fuera del flujo local)
# =============================================================================
# ANTES DE USAR ESTE ARCHIVO, LEE ESTE ENCABEZADO.
#
# ¿Qué es este archivo?
#   Es el compose "base" del bootstrap (Fase 1). Levanta un stack completo
#   (PostgreSQL + backend + frontend + backup-sidecar) pensado para ejecutarse
#   con docker compose sin scripts: `docker compose -f docker-compose.full.yml up -d`.
#
# ⚠ ADVERTENCIA DE COLISIONES
#   NO lo levantes al mismo tiempo que docker-compose.local.yml: ambos usan los
#   mismos puertos (5433, 8080, 5173). Si ya tienes el stack local corriendo
#   (scripts\local-start.ps1), usa SIEMPRE el compose local.
#
# Diferencias con docker-compose.local.yml:
#   - Container names con prefijo asistente-full-* (sin colision con asistente-*)
#   - Volumen de datos propio: postgres-full-data (NO comparte la BD local)
#   - Volumen de backups propio: postgres-full-backups
#   - Red propia: asistente-full
#   - No usa .env.local (usa variables del shell o defaults; setea secretos:
#     POSTGRES_PASSWORD, APP_DB_PASSWORD, APP_JWT_SECRET, ...)
#   - El backend corre con Cloud API habilitado y DNS 1.1.1.1/8.8.8.8 para
#     salida a Internet (modo NO aislado; NO es el flujo local oficial).
#
# Perfiles opcionales:
#   --profile backup   -> levanta backup-sidecar (cron diario 04:00, RETENTION_DAYS)
# =============================================================================

services:
  postgres:
    image: postgres:16.14-alpine
    container_name: asistente-full-postgres
    environment:
      POSTGRES_DB: asistente_whatsapp
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-db-password}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d asistente_whatsapp"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-full-data:/var/lib/postgresql/data
    networks:
      - asistente-full

  backup-sidecar:
    image: postgres:16.14-alpine
    container_name: asistente-full-backup
    profiles:
      - backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: assistant
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me-db-password}
      PGDATABASE: asistente_whatsapp
      BACKUP_DIR: /backups
      RETENTION_DAYS: "7"
      CRON_SCHEDULE: ${BACKUP_CRON_SCHEDULE:-0 4 * * *}
    volumes:
      - ./scripts/backup-sidecar-entrypoint.sh:/entrypoint.sh:ro
      - postgres-full-backups:/backups
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    restart: unless-stopped
    networks:
      - asistente-full

  backend-java:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
      network: host
    container_name: asistente-full-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      APP_DB_URL: jdbc:postgresql://postgres:5432/asistente_whatsapp
      APP_DB_USERNAME: assistant
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-change-me-db-password}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-me-jwt-secret-minimo-32-caracteres!!}
      APP_ACCESS_TOKEN_EXPIRES_IN_SECONDS: 28800
      APP_RESET_TOKEN_EXPIRES_IN_MINUTES: 30
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173
      APP_WHATSAPP_CHANNEL_PROVIDER: META_CLOUD_API
      APP_WHATSAPP_CLOUD_API_ENABLED: "true"
      APP_WHATSAPP_CLOUD_API_DRY_RUN_ENABLED: "false"
      APP_AI_AGENTS_ENABLED: "true"
      APP_AI_AGENTS_AUTO_REPLY_ENABLED: "false"
      APP_AI_AGENTS_AUDIT_ENABLED: "true"
      APP_AI_AGENTS_OUTBOX_WORKER_INTERVAL_MS: "5000"
      APP_AI_AGENTS_OUTBOX_BATCH_SIZE: "10"
      APP_AI_AGENTS_OUTBOX_PROCESSING_TIMEOUT_MS: "120000"
      APP_AI_AGENTS_OUTBOX_RETRY_BASE_DELAY_MS: "30000"
      APP_AI_AGENTS_OUTBOX_RETRY_MAX_DELAY_MS: "900000"
      APP_OPENAI_ENABLED: "false"
      APP_OPENAI_BASE_URL: https://api.openai.com/v1/responses
      APP_OPENAI_API_KEY: ""
      APP_OPENAI_MODEL: "gpt-5.4-mini"
      APP_OPENAI_TIMEOUT_SECONDS: 30
      APP_BOOKING_CONFIRMATION_EXPIRATION_MINUTES: ${APP_BOOKING_CONFIRMATION_EXPIRATION_MINUTES:-30}
      APP_BOOKING_CONFIRMATION_EXPIRATION_SCAN_MS: ${APP_BOOKING_CONFIRMATION_EXPIRATION_SCAN_MS:-60000}
      APP_BOOKING_CONFIRMATION_PUBLIC_BASE_URL: ${APP_BOOKING_CONFIRMATION_PUBLIC_BASE_URL:-http://localhost:5173/reservas/confirmar}
      APP_BOOKING_CONFIRMATION_DISPATCH_WHATSAPP: ${APP_BOOKING_CONFIRMATION_DISPATCH_WHATSAPP:-false}
      APP_BOOKING_CONFIRMATION_MIN_MINUTES_AHEAD: ${APP_BOOKING_CONFIRMATION_MIN_MINUTES_AHEAD:-60}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q UP <&3'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - asistente-full

  frontend-react:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
      network: host
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    container_name: asistente-full-frontend
    ports:
      - "5173:5173"
    depends_on:
      backend-java:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:5173 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - asistente-full

volumes:
  postgres-full-data:
  postgres-full-backups:

networks:
  asistente-full:
    driver: bridge
