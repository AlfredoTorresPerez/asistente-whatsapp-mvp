spring:
  application:
    name: backend-java
  datasource:
    url: ${APP_DB_URL:jdbc:postgresql://localhost:5432/asistente_whatsapp}
    username: ${APP_DB_USERNAME:assistant}
    password: ${APP_DB_PASSWORD:assistant}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
            required: ${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:false}
          connectiontimeout: ${SPRING_MAIL_CONNECTION_TIMEOUT:10000}
          timeout: ${SPRING_MAIL_TIMEOUT:10000}
          writetimeout: ${SPRING_MAIL_WRITE_TIMEOUT:10000}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  health:
    mail:
      enabled: ${APP_EMAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  environment: ${APP_ENVIRONMENT:local}
  rate-limiting:
    enabled: ${APP_RATE_LIMITING_ENABLED:true}
  logging:
    include-message-body: ${APP_LOGGING_INCLUDE_MESSAGE_BODY:false}
  security:
    jwt:
      secret: ${APP_JWT_SECRET:change-this-secret-in-local-development-please-2026}
      access-token-expires-in-seconds: ${APP_ACCESS_TOKEN_EXPIRES_IN_SECONDS:900}
      reset-token-expires-in-minutes: ${APP_RESET_TOKEN_EXPIRES_IN_MINUTES:30}
    cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
  channels:
    whatsapp:
      provider: ${APP_WHATSAPP_CHANNEL_PROVIDER:WEB}
    whatsapp-web:
      enabled: ${APP_WHATSAPP_WEB_ENABLED:false}
      base-url: ${APP_WHATSAPP_WEB_BASE_URL:http://localhost:3001}
      api-key: ${APP_WHATSAPP_WEB_API_KEY:dev-whatsapp-web-key}
      default-phone-number: ${APP_WHATSAPP_WEB_DEFAULT_PHONE_NUMBER:56950954580}
      webhook-secret: ${APP_WHATSAPP_WEB_WEBHOOK_SECRET:dev-whatsapp-web-webhook-secret}
      webhook-tolerance-seconds: ${APP_WHATSAPP_WEB_WEBHOOK_TOLERANCE_SECONDS:300}
      demo-fallback-enabled: ${APP_WHATSAPP_WEB_DEMO_FALLBACK_ENABLED:false}
      test-phone-map: {}
      log-raw-payload: ${APP_LOGGING_INCLUDE_MESSAGE_BODY:false}
      qr-timeout-seconds: ${APP_WHATSAPP_WEB_QR_TIMEOUT_SECONDS:120}
    whatsapp-cloud-api:
      enabled: ${APP_WHATSAPP_CLOUD_API_ENABLED:false}
      base-url: ${APP_WHATSAPP_CLOUD_API_BASE_URL:https://graph.facebook.com}
      api-version: ${APP_WHATSAPP_CLOUD_API_VERSION:v23.0}
      phone-number-id: ${APP_WHATSAPP_CLOUD_API_PHONE_NUMBER_ID:}
      access-token: ${APP_WHATSAPP_CLOUD_API_ACCESS_TOKEN:}
      default-phone-number: ${APP_WHATSAPP_CLOUD_API_DEFAULT_PHONE_NUMBER:${APP_WHATSAPP_WEB_DEFAULT_PHONE_NUMBER:56950954580}}
      dry-run-enabled: ${APP_WHATSAPP_CLOUD_API_DRY_RUN_ENABLED:false}
  ai:
    agents:
      enabled: ${APP_AI_AGENTS_ENABLED:true}
      auto-reply-enabled: ${APP_AI_AGENTS_AUTO_REPLY_ENABLED:false}
      audit-enabled: ${APP_AI_AGENTS_AUDIT_ENABLED:true}
      safe-mode-enabled: ${APP_AI_AGENTS_SAFE_MODE_ENABLED:false}
      default-confidence: ${APP_AI_AGENTS_DEFAULT_CONFIDENCE:0.78}
      outbox-worker-interval-ms: ${APP_AI_AGENTS_OUTBOX_WORKER_INTERVAL_MS:5000}
      outbox-batch-size: ${APP_AI_AGENTS_OUTBOX_BATCH_SIZE:10}
      outbox-processing-timeout-ms: ${APP_AI_AGENTS_OUTBOX_PROCESSING_TIMEOUT_MS:120000}
      outbox-retry-base-delay-ms: ${APP_AI_AGENTS_OUTBOX_RETRY_BASE_DELAY_MS:30000}
      outbox-retry-max-delay-ms: ${APP_AI_AGENTS_OUTBOX_RETRY_MAX_DELAY_MS:900000}
    openai:
      enabled: ${APP_OPENAI_ENABLED:false}
      base-url: ${APP_OPENAI_BASE_URL:https://api.openai.com/v1/responses}
      api-key: ${APP_OPENAI_API_KEY:}
      model: ${APP_OPENAI_MODEL:gpt-5.4-mini}
      timeout-seconds: ${APP_OPENAI_TIMEOUT_SECONDS:30}
  booking-confirmation:
    expiration-minutes: ${APP_BOOKING_CONFIRMATION_EXPIRATION_MINUTES:720}
    expiration-scan-ms: ${APP_BOOKING_CONFIRMATION_EXPIRATION_SCAN_MS:60000}
    public-base-url: ${APP_BOOKING_CONFIRMATION_PUBLIC_BASE_URL:http://localhost:5173/reservas/confirmar}
    dispatch-whatsapp: ${APP_BOOKING_CONFIRMATION_DISPATCH_WHATSAPP:false}
  booking-payment:
    provider: ${APP_BOOKING_PAYMENT_PROVIDER:SIMULATED}
    webhook-signature-enabled: ${APP_BOOKING_PAYMENT_WEBHOOK_SIGNATURE_ENABLED:true}
    webhook-secret: ${APP_BOOKING_PAYMENT_WEBHOOK_SECRET:}
    webhook-tolerance-seconds: ${APP_BOOKING_PAYMENT_WEBHOOK_TOLERANCE_SECONDS:300}
    checkout-public-base-url: ${APP_BOOKING_PAYMENT_CHECKOUT_PUBLIC_BASE_URL:http://localhost:5173/reservas/pagar}
    checkout-expiration-minutes: ${APP_BOOKING_PAYMENT_CHECKOUT_EXPIRATION_MINUTES:30}
    dispatch-whatsapp: ${APP_BOOKING_PAYMENT_DISPATCH_WHATSAPP:false}
    dispatch-email: ${APP_BOOKING_PAYMENT_DISPATCH_EMAIL:true}
    dispatch-post-payment-whatsapp: ${APP_BOOKING_PAYMENT_DISPATCH_POST_PAYMENT_WHATSAPP:false}
    dispatch-post-payment-email: ${APP_BOOKING_PAYMENT_DISPATCH_POST_PAYMENT_EMAIL:true}
    expiration-scan-ms: ${APP_BOOKING_PAYMENT_EXPIRATION_SCAN_MS:60000}
    expiration-batch-size: ${APP_BOOKING_PAYMENT_EXPIRATION_BATCH_SIZE:100}
    external-checkout-url-template: ${APP_BOOKING_PAYMENT_EXTERNAL_CHECKOUT_URL_TEMPLATE:}
    webhook-public-url: ${APP_BOOKING_PAYMENT_WEBHOOK_PUBLIC_URL:}
    mercadopago:
      access-token: ${APP_MERCADOPAGO_ACCESS_TOKEN:}
      notification-url: ${APP_MERCADOPAGO_NOTIFICATION_URL:}
  booking-reschedule:
    public-base-url: ${APP_BOOKING_RESCHEDULE_PUBLIC_BASE_URL:http://localhost:5173/reservas/reprogramar}
  booking-cancellation:
    public-base-url: ${APP_BOOKING_CANCELLATION_PUBLIC_BASE_URL:http://localhost:5173/reservas/cancelar}
  email:
    enabled: ${APP_EMAIL_ENABLED:false}
    from: ${APP_EMAIL_FROM:no-reply@localhost}
    from-name: ${APP_EMAIL_FROM_NAME:Centro estetico}
    simulation-enabled: ${APP_EMAIL_SIMULATION_ENABLED:true}
  calendar:
    encryption-secret: ${APP_CALENDAR_ENCRYPTION_SECRET:}
    google:
      enabled: ${APP_CALENDAR_GOOGLE_ENABLED:false}
      client-id: ${APP_CALENDAR_GOOGLE_CLIENT_ID:}
      client-secret: ${APP_CALENDAR_GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${APP_CALENDAR_GOOGLE_REDIRECT_URI:}
    sync:
      enabled: ${APP_CALENDAR_SYNC_ENABLED:true}
      retry-interval-ms: ${APP_CALENDAR_SYNC_RETRY_INTERVAL_MS:300000}
      max-retries: ${APP_CALENDAR_SYNC_MAX_RETRIES:5}
  frontend:
    public-base-url: ${APP_FRONTEND_PUBLIC_BASE_URL:http://localhost:5173}
  observability:
    method-tracing:
      enabled: ${APP_METHOD_TRACING_ENABLED:false}
      log-arguments: ${APP_METHOD_TRACING_LOG_ARGUMENTS:true}
      log-result: ${APP_METHOD_TRACING_LOG_RESULT:false}
      max-payload-length: ${APP_METHOD_TRACING_MAX_PAYLOAD_LENGTH:600}
      slow-execution-threshold-ms: ${APP_METHOD_TRACING_SLOW_THRESHOLD_MS:1500}

sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: 0.1
  enable-tracing: ${SENTRY_ENABLED:false}

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-sin-correlacion}]"
  level:
    com.asistentewhatsapp: INFO
    AI_TRACE: INFO
