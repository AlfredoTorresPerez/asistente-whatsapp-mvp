app:
  environment: local

---
spring:
  config:
    activate:
      on-profile: local-base

app:
  rate-limiting:
    enabled: ${APP_RATE_LIMITING_ENABLED:true}
  logging:
    include-message-body: ${APP_LOGGING_INCLUDE_MESSAGE_BODY:false}
  channels:
    whatsapp:
      provider: DISABLED
    whatsapp-web:
      enabled: false
      simulator-enabled: true
      demo-fallback-enabled: true
    whatsapp-cloud-api:
      enabled: false
      dry-run-enabled: true
      webhook-signature-required: false
  ai:
    agents:
      auto-reply-enabled: ${APP_AI_AGENTS_AUTO_REPLY_ENABLED:false}
      safe-mode-enabled: ${APP_AI_AGENTS_SAFE_MODE_ENABLED:true}
  email:
    enabled: false
    simulation-enabled: true
  calendar:
    google:
      enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

sentry:
  enabled: false
  dsn: ""

logging:
  level:
    com.asistentewhatsapp: ${APP_LOG_LEVEL:DEBUG}
