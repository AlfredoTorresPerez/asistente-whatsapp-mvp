app:
  environment: qa
  rate-limiting:
    enabled: ${APP_RATE_LIMITING_ENABLED:true}
  logging:
    include-message-body: ${APP_LOGGING_INCLUDE_MESSAGE_BODY:false}
  channels:
    whatsapp-web:
      enabled: ${APP_WHATSAPP_WEB_ENABLED:false}
      simulator-enabled: false
      demo-fallback-enabled: false
    whatsapp-cloud-api:
      dry-run-enabled: ${APP_WHATSAPP_CLOUD_API_DRY_RUN_ENABLED:false}
  ai:
    agents:
      auto-reply-enabled: ${APP_AI_AGENTS_AUTO_REPLY_ENABLED:true}
      safe-mode-enabled: ${APP_AI_AGENTS_SAFE_MODE_ENABLED:false}
  email:
    enabled: ${APP_EMAIL_ENABLED:false}
    simulation-enabled: ${APP_EMAIL_SIMULATION_ENABLED:true}
  calendar:
    google:
      enabled: ${APP_CALENDAR_GOOGLE_ENABLED:false}
  booking:
    confirmation:
      public-base-url: ${APP_BOOKING_CONFIRMATION_PUBLIC_BASE_URL:}
    reschedule:
      public-base-url: ${APP_BOOKING_RESCHEDULE_PUBLIC_BASE_URL:}
    cancellation:
      public-base-url: ${APP_BOOKING_CANCELLATION_PUBLIC_BASE_URL:}
    payment:
      checkout-public-base-url: ${APP_BOOKING_PAYMENT_CHECKOUT_PUBLIC_BASE_URL:}
  frontend:
    public-base-url: ${APP_FRONTEND_PUBLIC_BASE_URL:}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}

sentry:
  enabled: ${SENTRY_ENABLED:false}
  dsn: ${SENTRY_DSN:}

logging:
  level:
    com.asistentewhatsapp: ${APP_LOG_LEVEL:INFO}

spring:
  datasource:
    url: ${APP_DB_URL:jdbc:postgresql://localhost:5432/asistente_qa}
    username: ${APP_DB_USERNAME:postgres}
    password: ${APP_DB_PASSWORD:change-me-qa}
  flyway:
    locations: classpath:db/migration
