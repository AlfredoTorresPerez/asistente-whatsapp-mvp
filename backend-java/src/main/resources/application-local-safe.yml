spring:
  config:
    activate:
      on-profile: local-safe

app:
  local-safe:
    enabled: true
    egress-guard-enabled: true
  channels:
    whatsapp:
      provider: ${APP_WHATSAPP_CHANNEL_PROVIDER:SIMULATED}
    whatsapp-cloud-api:
      enabled: ${APP_WHATSAPP_CLOUD_API_ENABLED:false}
  ai:
    agents:
      auto-reply-enabled: ${APP_AI_AGENTS_AUTO_REPLY_ENABLED:false}
      safe-mode-enabled: ${APP_AI_AGENTS_SAFE_MODE_ENABLED:true}
    openai:
      enabled: ${APP_OPENAI_ENABLED:false}
  email:
    enabled: ${APP_EMAIL_ENABLED:false}
    simulation-enabled: ${APP_EMAIL_SIMULATION_ENABLED:true}
    mirror:
      enabled: ${APP_EMAIL_MIRROR_ENABLED:false}
      host: ${APP_EMAIL_MIRROR_HOST:}
  calendar:
    google:
      enabled: ${APP_CALENDAR_GOOGLE_ENABLED:false}
  booking-payment:
    provider: ${APP_BOOKING_PAYMENT_PROVIDER:SIMULATED}
