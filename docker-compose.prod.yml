services:
  postgres:
    image: postgres:16-alpine
    container_name: asistente-whatsapp-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asistente_whatsapp}
      POSTGRES_USER: ${POSTGRES_USER:-assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assistant} -d ${POSTGRES_DB:-asistente_whatsapp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data

  backend-java:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
      network: host
    container_name: asistente-whatsapp-backend-prod
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      APP_ENVIRONMENT: production
      APP_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-asistente_whatsapp}
      APP_DB_USERNAME: ${POSTGRES_USER:-assistant}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-}
      APP_ACCESS_TOKEN_EXPIRES_IN_SECONDS: ${APP_ACCESS_TOKEN_EXPIRES_IN_SECONDS:-900}
      APP_RESET_TOKEN_EXPIRES_IN_MINUTES: ${APP_RESET_TOKEN_EXPIRES_IN_MINUTES:-30}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
      APP_WHATSAPP_CHANNEL_PROVIDER: CLOUD_API
      APP_WHATSAPP_WEB_ENABLED: "false"
      APP_WHATSAPP_CLOUD_API_ENABLED: "true"
      APP_WHATSAPP_CLOUD_API_BASE_URL: ${APP_WHATSAPP_CLOUD_API_BASE_URL:-https://graph.facebook.com}
      APP_WHATSAPP_CLOUD_API_VERSION: ${APP_WHATSAPP_CLOUD_API_VERSION:-v23.0}
      APP_WHATSAPP_CLOUD_API_PHONE_NUMBER_ID: ${APP_WHATSAPP_CLOUD_API_PHONE_NUMBER_ID:-}
      APP_WHATSAPP_CLOUD_API_ACCESS_TOKEN: ${APP_WHATSAPP_CLOUD_API_ACCESS_TOKEN:-}
      APP_WHATSAPP_CLOUD_API_DEFAULT_PHONE_NUMBER: ${APP_WHATSAPP_CLOUD_API_DEFAULT_PHONE_NUMBER:-56950954580}
      APP_WHATSAPP_CLOUD_API_DRY_RUN_ENABLED: ${APP_WHATSAPP_CLOUD_API_DRY_RUN_ENABLED:-false}
      APP_AI_AGENTS_ENABLED: "true"
      APP_AI_AGENTS_AUTO_REPLY_ENABLED: "false"
      APP_AI_AGENTS_AUDIT_ENABLED: "true"
      APP_AI_AGENTS_OUTBOX_WORKER_INTERVAL_MS: "5000"
      APP_AI_AGENTS_OUTBOX_BATCH_SIZE: "10"
      APP_AI_AGENTS_OUTBOX_PROCESSING_TIMEOUT_MS: "120000"
      APP_AI_AGENTS_OUTBOX_RETRY_BASE_DELAY_MS: "30000"
      APP_AI_AGENTS_OUTBOX_RETRY_MAX_DELAY_MS: "900000"
      APP_OPENAI_ENABLED: ${APP_OPENAI_ENABLED:-false}
      APP_OPENAI_BASE_URL: ${APP_OPENAI_BASE_URL:-https://api.openai.com/v1/responses}
      APP_OPENAI_API_KEY: ${APP_OPENAI_API_KEY:-}
      APP_OPENAI_MODEL: ${APP_OPENAI_MODEL:-gpt-5.4-mini}
      APP_OPENAI_TIMEOUT_SECONDS: ${APP_OPENAI_TIMEOUT_SECONDS:-30}
      APP_BOOKING_CONFIRMATION_EXPIRATION_MINUTES: ${APP_BOOKING_CONFIRMATION_EXPIRATION_MINUTES:-30}
      APP_BOOKING_CONFIRMATION_EXPIRATION_SCAN_MS: ${APP_BOOKING_CONFIRMATION_EXPIRATION_SCAN_MS:-60000}
      APP_BOOKING_CONFIRMATION_PUBLIC_BASE_URL: ${APP_BOOKING_CONFIRMATION_PUBLIC_BASE_URL:-https://demo.example.com/reservas/confirmar}
      APP_BOOKING_CONFIRMATION_DISPATCH_WHATSAPP: ${APP_BOOKING_CONFIRMATION_DISPATCH_WHATSAPP:-false}
      APP_BOOKING_PAYMENT_PROVIDER: ${APP_BOOKING_PAYMENT_PROVIDER:-SIMULATED}
      APP_BOOKING_PAYMENT_WEBHOOK_PUBLIC_URL: ${APP_BOOKING_PAYMENT_WEBHOOK_PUBLIC_URL:-}
      APP_BOOKING_PAYMENT_CHECKOUT_PUBLIC_BASE_URL: ${APP_BOOKING_PAYMENT_CHECKOUT_PUBLIC_BASE_URL:-https://demo.example.com/reservas/pagar}
      APP_MERCADOPAGO_ACCESS_TOKEN: ${APP_MERCADOPAGO_ACCESS_TOKEN:-}
      APP_MERCADOPAGO_WEBHOOK_SECRET: ${APP_MERCADOPAGO_WEBHOOK_SECRET:-}
      APP_MERCADOPAGO_NOTIFICATION_URL: ${APP_MERCADOPAGO_NOTIFICATION_URL:-}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q UP <&3'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend-react:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
      network: host
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: asistente-whatsapp-frontend-prod
    depends_on:
      backend-java:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    ports:
      - "${FRONTEND_PORT:-8081}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-prod-data:
