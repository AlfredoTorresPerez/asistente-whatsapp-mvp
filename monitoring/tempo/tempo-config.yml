# =============================================================================
# Tempo 2.8.1 - almacenamiento local de trazas (single binary, OTLP)
# =============================================================================
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  trace_idle_period: 10s
  max_block_bytes: 1048576
  max_block_duration: 5m

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    block_retention: 24h

query_frontend:
  search:
    default_result_limit: 100

querier:
  max_concurrent_queries: 4
