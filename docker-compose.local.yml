# =============================================================================
# ASISTENTE WHATSAPP MVP - ENTORNO DE DESARROLLO LOCAL
# =============================================================================
# Levantar:
#   docker compose --env-file .env.local -f docker-compose.local.yml up -d
#
# Observabilidad (Prometheus, Grafana, Loki, Tempo, Alloy):
#   docker compose --env-file .env.local -f docker-compose.local.yml --profile observability up -d
#   (el perfil antiguo "monitoring" se mantiene como alias; "observability" es el canonico)
#
# Sin --env-file no se carga .env.local automáticamente.
#
# Servicios y puertos:
#   postgres         5433:5432
#   backend-java     8080:8080
#   frontend-react   5173:5173
#   mailpit          1025:1025 (SMTP), 8025:8025 (Web UI)
#   grafana          3000:3000 (perfil observability)
#   prometheus       9090:9090 (perfil observability)
#   loki             127.0.0.1:3100 (solo localhost, perfil observability)
#   tempo            127.0.0.1:3200 (solo localhost, perfil observability)
#   alloy            sin puerto publicado (recolecta logs de contenedores)
# =============================================================================

networks:
  asistente-local:
    driver: bridge

services:
  # ---------------------------------------------------------------------------
  # POSTGRESQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: asistente-postgres
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    environment:
      TZ: ${TZ:-America/Santiago}
      PGTZ: ${TZ:-America/Santiago}
      POSTGRES_DB: asistente_whatsapp
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d asistente_whatsapp"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - asistente-local

  # ---------------------------------------------------------------------------
  # BACKEND JAVA (Spring Boot 3)
  # ---------------------------------------------------------------------------
  backend-java:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: asistente-backend
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-America/Santiago}
      JAVA_TOOL_OPTIONS: "-Duser.timezone=America/Santiago"
      SERVER_PORT: 8080
      APP_DB_URL: jdbc:postgresql://postgres:5432/asistente_whatsapp
      APP_DB_USERNAME: assistant
      APP_DB_PASSWORD: assistant
      APP_JWT_SECRET: ${APP_JWT_SECRET:-}
      APP_ACCESS_TOKEN_EXPIRES_IN_SECONDS: 28800
      APP_RESET_TOKEN_EXPIRES_IN_MINUTES: 30
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}

      # WhatsApp — proveedor simulado por defecto en local-base
      APP_WHATSAPP_CHANNEL_PROVIDER: ${APP_WHATSAPP_CHANNEL_PROVIDER:-SIMULATED}
      APP_WHATSAPP_CLOUD_API_ENABLED: ${APP_WHATSAPP_CLOUD_API_ENABLED:-false}
      APP_WHATSAPP_CLOUD_API_DRY_RUN_ENABLED: ${APP_WHATSAPP_CLOUD_API_DRY_RUN_ENABLED:-true}
      # Las siguientes se activan solo si APP_WHATSAPP_CLOUD_API_ENABLED=true
      APP_WHATSAPP_CLOUD_API_BASE_URL: ${APP_WHATSAPP_CLOUD_API_BASE_URL:-https://graph.facebook.com}
      APP_WHATSAPP_CLOUD_API_VERSION: ${APP_WHATSAPP_CLOUD_API_VERSION:-v23.0}
      APP_WHATSAPP_CLOUD_API_DEFAULT_PHONE_NUMBER: ${APP_WHATSAPP_CLOUD_API_DEFAULT_PHONE_NUMBER:-56927305158}
      APP_WHATSAPP_CLOUD_API_CONNECT_TIMEOUT_SECONDS: ${APP_WHATSAPP_CLOUD_API_CONNECT_TIMEOUT_SECONDS:-5}
      APP_WHATSAPP_CLOUD_API_READ_TIMEOUT_SECONDS: ${APP_WHATSAPP_CLOUD_API_READ_TIMEOUT_SECONDS:-15}
      # Credenciales Cloud API (requeridas si enabled=true)
      APP_WHATSAPP_CLOUD_API_APP_ID: ${APP_WHATSAPP_CLOUD_API_APP_ID:-}
      APP_WHATSAPP_CLOUD_API_APP_SECRET: ${APP_WHATSAPP_CLOUD_API_APP_SECRET:-}
      APP_WHATSAPP_CLOUD_API_WEBHOOK_VERIFY_TOKEN: ${APP_WHATSAPP_CLOUD_API_WEBHOOK_VERIFY_TOKEN:-}
      APP_WHATSAPP_CLOUD_API_WEBHOOK_PUBLIC_URL: ${APP_WHATSAPP_CLOUD_API_WEBHOOK_PUBLIC_URL:-}
      APP_WHATSAPP_CLOUD_API_WEBHOOK_SIGNATURE_REQUIRED: ${APP_WHATSAPP_CLOUD_API_WEBHOOK_SIGNATURE_REQUIRED:-true}
      APP_WHATSAPP_CLOUD_API_CREDENTIAL_ENCRYPTION_SECRET: ${APP_WHATSAPP_CLOUD_API_CREDENTIAL_ENCRYPTION_SECRET:-}
      APP_WHATSAPP_CLOUD_API_PHONE_NUMBER_ID: ${APP_WHATSAPP_CLOUD_API_PHONE_NUMBER_ID:-}
      APP_WHATSAPP_CLOUD_API_BUSINESS_ACCOUNT_ID: ${APP_WHATSAPP_CLOUD_API_BUSINESS_ACCOUNT_ID:-}
      APP_WHATSAPP_CLOUD_API_ACCESS_TOKEN: ${APP_WHATSAPP_CLOUD_API_ACCESS_TOKEN:-}

      APP_LOGGING_INCLUDE_MESSAGE_BODY: ${APP_LOGGING_INCLUDE_MESSAGE_BODY:-false}

      # Observabilidad: perfil Spring "observability" (JSON logs, OTLP -> Tempo)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local},observability
      APP_TRACING_ENABLED: ${APP_TRACING_ENABLED:-true}
      OTLP_TRACING_ENDPOINT: ${OTLP_TRACING_ENDPOINT:-http://tempo:4318/v1/traces}

      # AI Agents
      APP_AI_AGENTS_ENABLED: ${APP_AI_AGENTS_ENABLED:-true}
      APP_AI_AGENTS_AUTO_REPLY_ENABLED: ${APP_AI_AGENTS_AUTO_REPLY_ENABLED:-true}
      APP_AI_AGENTS_SAFE_MODE_ENABLED: ${APP_AI_AGENTS_SAFE_MODE_ENABLED:-false}
      APP_AI_AGENTS_AUDIT_ENABLED: ${APP_AI_AGENTS_AUDIT_ENABLED:-true}
      APP_AI_AGENTS_OUTBOX_WORKER_INTERVAL_MS: ${APP_AI_AGENTS_OUTBOX_WORKER_INTERVAL_MS:-5000}
      APP_AI_AGENTS_OUTBOX_BATCH_SIZE: ${APP_AI_AGENTS_OUTBOX_BATCH_SIZE:-10}
      APP_AI_AGENTS_OUTBOX_PROCESSING_TIMEOUT_MS: ${APP_AI_AGENTS_OUTBOX_PROCESSING_TIMEOUT_MS:-120000}
      APP_AI_AGENTS_OUTBOX_RETRY_BASE_DELAY_MS: ${APP_AI_AGENTS_OUTBOX_RETRY_BASE_DELAY_MS:-30000}
      APP_AI_AGENTS_OUTBOX_RETRY_MAX_DELAY_MS: ${APP_AI_AGENTS_OUTBOX_RETRY_MAX_DELAY_MS:-900000}
      APP_OPENAI_ENABLED: ${APP_OPENAI_ENABLED:-false}
      APP_OPENAI_API_KEY: ${APP_OPENAI_API_KEY:-}

      # Booking
      APP_BOOKING_CONFIRMATION_EXPIRATION_MINUTES: ${APP_BOOKING_CONFIRMATION_EXPIRATION_MINUTES:-60}
      APP_BOOKING_CONFIRMATION_EXPIRATION_SCAN_MS: ${APP_BOOKING_CONFIRMATION_EXPIRATION_SCAN_MS:-60000}
      APP_BOOKING_CONFIRMATION_PUBLIC_BASE_URL: ${APP_BOOKING_CONFIRMATION_PUBLIC_BASE_URL:-http://localhost:5173/reservas/confirmar}
      APP_BOOKING_CONFIRMATION_DISPATCH_WHATSAPP: ${APP_BOOKING_CONFIRMATION_DISPATCH_WHATSAPP:-false}
      APP_BOOKING_PAYMENT_PROVIDER: ${APP_BOOKING_PAYMENT_PROVIDER:-SIMULATED}

      # Frontend URLs
      APP_FRONTEND_PUBLIC_BASE_URL: ${APP_FRONTEND_PUBLIC_BASE_URL:-http://localhost:5173}
      APP_BOOKING_RESCHEDULE_PUBLIC_BASE_URL: ${APP_BOOKING_RESCHEDULE_PUBLIC_BASE_URL:-http://localhost:5173/reservas/reprogramar}
      APP_BOOKING_CANCELLATION_PUBLIC_BASE_URL: ${APP_BOOKING_CANCELLATION_PUBLIC_BASE_URL:-http://localhost:5173/reservas/cancelar}
      APP_BOOKING_PAYMENT_CHECKOUT_PUBLIC_BASE_URL: ${APP_BOOKING_PAYMENT_CHECKOUT_PUBLIC_BASE_URL:-http://localhost:5173/reservas/pagar}

      # Email (Mailpit - SMTP local sin credenciales; web UI en http://localhost:8025)
      APP_EMAIL_ENABLED: "true"
      APP_EMAIL_SIMULATION_ENABLED: "false"
      APP_EMAIL_HEALTH_ENABLED: "false"
      APP_EMAIL_FROM: ${APP_EMAIL_FROM:-notificacionesassistentelocale@gmail.com}
      APP_EMAIL_FROM_NAME: ${APP_EMAIL_FROM_NAME:-Centro Estetico Bella}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-false}
      SPRING_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:-false}
      SPRING_MAIL_SMTP_STARTTLS_REQUIRED: ${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:-false}
      APP_EMAIL_MIRROR_ENABLED: ${APP_EMAIL_MIRROR_ENABLED:-true}
      APP_EMAIL_MIRROR_HOST: ${APP_EMAIL_MIRROR_HOST:-smtp.gmail.com}
      APP_EMAIL_MIRROR_PORT: ${APP_EMAIL_MIRROR_PORT:-587}
      APP_EMAIL_MIRROR_USERNAME: ${APP_EMAIL_MIRROR_USERNAME:-notificacionesassistentelocale@gmail.com}
      APP_EMAIL_MIRROR_PASSWORD: ${APP_EMAIL_MIRROR_PASSWORD:-}
      APP_EMAIL_MIRROR_SMTP_AUTH: ${APP_EMAIL_MIRROR_SMTP_AUTH:-true}
      APP_EMAIL_MIRROR_SMTP_STARTTLS_ENABLE: ${APP_EMAIL_MIRROR_SMTP_STARTTLS_ENABLE:-true}
      APP_EMAIL_MIRROR_SMTP_STARTTLS_REQUIRED: ${APP_EMAIL_MIRROR_SMTP_STARTTLS_REQUIRED:-false}

      # Calendar
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q UP <&3'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - asistente-local

  # ---------------------------------------------------------------------------
  # FRONTEND REACT (Vite dev server)
  # ---------------------------------------------------------------------------
  frontend-react:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
      target: dev
    container_name: asistente-frontend
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      backend-java:
        condition: service_healthy
    environment:
      TZ: ${TZ:-America/Santiago}
      VITE_API_BASE_URL: /api/v1
      VITE_META_APP_ID: ${VITE_META_APP_ID:-}
      VITE_META_EMBEDDED_SIGNUP_CONFIG_ID: ${VITE_META_EMBEDDED_SIGNUP_CONFIG_ID:-}
      VITE_META_GRAPH_API_VERSION: ${VITE_META_GRAPH_API_VERSION:-v23.0}
      VITE_PUBLIC_WHATSAPP_NUMBER: ${VITE_PUBLIC_WHATSAPP_NUMBER:-56927305158}
      VITE_PROXY_API: http://backend-java:8080
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - asistente-local



  # ---------------------------------------------------------------------------
  # MAILPIT (SMTP testing server - local email capture)
  # http://localhost:8025 to view captured emails
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.24.0
    container_name: asistente-mailpit
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.2
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - asistente-local

  # ---------------------------------------------------------------------------
  # PUBLIC HTTPS TUNNEL (opcional: requiere --profile public-link)
  # ---------------------------------------------------------------------------
  public-tunnel:
    profiles:
      - public-link
    image: cloudflare/cloudflared:latest
    container_name: asistente-public-tunnel
    restart: unless-stopped
    depends_on:
      frontend-react:
        condition: service_healthy
    # Túnel estable (URL fija): definir CF_TUNNEL_COMMAND en .env.local, ej:
    #   CF_TUNNEL_COMMAND=tunnel --no-autoupdate run --token <TOKEN_DE_CLOUDFLARE_DASHBOARD>
    # Sin esa variable usa el quick tunnel temporal trycloudflare.com
    command: ${CF_TUNNEL_COMMAND:-tunnel --no-autoupdate --url http://frontend-react:5173}
    networks:
      - asistente-local

  # ---------------------------------------------------------------------------
  # OBSERVABILIDAD LOCAL (opcional: requiere --profile observability)
  # ---------------------------------------------------------------------------
  prometheus:
    profiles:
      - observability
      - monitoring
    image: prom/prometheus:v3.5.0
    container_name: asistente-prometheus
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - asistente-local
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    profiles:
      - observability
      - monitoring
    image: grafana/loki:3.5.0
    container_name: asistente-loki
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.3
    command:
      - -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - asistente-local
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  tempo:
    profiles:
      - observability
      - monitoring
    image: grafana/tempo:2.8.1
    container_name: asistente-tempo
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.3
    command:
      - -config.file=/etc/tempo/tempo-config.yml
    volumes:
      - ./monitoring/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    networks:
      - asistente-local
    healthcheck:
      test: ["CMD", "/busybox/wget", "-q", "-O", "-", "http://127.0.0.1:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  alloy:
    profiles:
      - observability
      - monitoring
    image: grafana/alloy:v1.9.1
    container_name: asistente-alloy
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.3
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - asistente-local
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/12345; printf \"GET /-/ready HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q 200 <&3'"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    profiles:
      - observability
      - monitoring
    image: grafana/grafana:11.6.1
    container_name: asistente-grafana
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SECURITY_ANONYMOUS_AUTH_ENABLED: "true"
      GF_SECURITY_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: grafana-lokiexplore-app
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/plugins/grafana-lokiexplore-app:/var/lib/grafana/plugins/grafana-lokiexplore-app:ro
    ports:
      - "3000:3000"
    networks:
      - asistente-local
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # CADDY (HTTPS local autosigned - opcional: requiere --profile https)
  # ---------------------------------------------------------------------------
  caddy:
    profiles:
      - https
    image: caddy:2-alpine
    container_name: asistente-caddy
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks:
      - asistente-local
    depends_on:
      backend-java:
        condition: service_healthy
      frontend-react:
        condition: service_healthy

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres-data:

  prometheus-data:

  grafana-data:

  loki-data:

  tempo-data:

  caddy-data:
