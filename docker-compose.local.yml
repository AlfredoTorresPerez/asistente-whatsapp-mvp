# =============================================================================
# ASISTENTE WHATSAPP MVP - ENTORNO DE DESARROLLO LOCAL
# =============================================================================
# Levantar (solo postgres + backend):
#   docker compose -f docker-compose.local.yml up -d
#
# Con WhatsApp Web:
#   docker compose -f docker-compose.local.yml --profile whatsapp up -d
#
# Servicios y puertos:
#   postgres         5433:5432
#   backend-java     8080:8080
#   frontend-react   5173:5173
#   whatsapp-web     3001:3001    (solo con --profile whatsapp)
# =============================================================================

networks:
  asistente-local:
    driver: bridge

services:
  # ---------------------------------------------------------------------------
  # POSTGRESQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: asistente-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Santiago}
      PGTZ: ${TZ:-America/Santiago}
      POSTGRES_DB: asistente_whatsapp
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d asistente_whatsapp"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - asistente-local

  # ---------------------------------------------------------------------------
  # BACKEND JAVA (Spring Boot 3)
  # ---------------------------------------------------------------------------
  backend-java:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: asistente-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-America/Santiago}
      JAVA_TOOL_OPTIONS: "-Duser.timezone=America/Santiago"
      SERVER_PORT: 8080
      APP_DB_URL: jdbc:postgresql://postgres:5432/asistente_whatsapp
      APP_DB_USERNAME: assistant
      APP_DB_PASSWORD: assistant
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-this-secret-in-local-development-please-2026}
      APP_ACCESS_TOKEN_EXPIRES_IN_SECONDS: 28800
      APP_RESET_TOKEN_EXPIRES_IN_MINUTES: 30
      APP_SECURITY_CORS_ALLOWED_ORIGINS: ${APP_SECURITY_CORS_ALLOWED_ORIGINS:-*}

      # WhatsApp Channel
      APP_WHATSAPP_CHANNEL_PROVIDER: WEB
      APP_WHATSAPP_WEB_ENABLED: ${APP_WHATSAPP_WEB_ENABLED:-true}
      APP_WHATSAPP_CLOUD_API_ENABLED: "false"
      APP_WHATSAPP_WEB_BASE_URL: ${APP_WHATSAPP_WEB_BASE_URL:-http://whatsapp-web-service:3001}
      APP_WHATSAPP_WEB_API_KEY: ${APP_WHATSAPP_WEB_API_KEY:-dev-whatsapp-web-key}
      APP_WHATSAPP_WEB_DEFAULT_PHONE_NUMBER: ${WHATSAPP_WEB_COMPANY_PHONE_NUMBER:-56900000000}
      APP_WHATSAPP_WEB_WEBHOOK_SECRET: ${APP_WHATSAPP_WEB_WEBHOOK_SECRET:-dev-whatsapp-web-webhook-secret}
      APP_WHATSAPP_WEB_WEBHOOK_TOLERANCE_SECONDS: ${APP_WHATSAPP_WEB_WEBHOOK_TOLERANCE_SECONDS:-600}
      APP_WHATSAPP_WEB_DEMO_FALLBACK_ENABLED: ${APP_WHATSAPP_WEB_DEMO_FALLBACK_ENABLED:-false}
      APP_WHATSAPP_WEB_QR_TIMEOUT_SECONDS: ${APP_WHATSAPP_WEB_QR_TIMEOUT_SECONDS:-120}
      APP_LOGGING_INCLUDE_MESSAGE_BODY: ${APP_LOGGING_INCLUDE_MESSAGE_BODY:-true}

      # AI Agents
      APP_AI_AGENTS_ENABLED: ${APP_AI_AGENTS_ENABLED:-true}
      APP_AI_AGENTS_AUTO_REPLY_ENABLED: ${APP_AI_AGENTS_AUTO_REPLY_ENABLED:-true}
      APP_AI_AGENTS_SAFE_MODE_ENABLED: ${APP_AI_AGENTS_SAFE_MODE_ENABLED:-false}
      APP_AI_AGENTS_AUDIT_ENABLED: ${APP_AI_AGENTS_AUDIT_ENABLED:-true}
      APP_AI_AGENTS_OUTBOX_WORKER_INTERVAL_MS: ${APP_AI_AGENTS_OUTBOX_WORKER_INTERVAL_MS:-5000}
      APP_AI_AGENTS_OUTBOX_BATCH_SIZE: ${APP_AI_AGENTS_OUTBOX_BATCH_SIZE:-10}
      APP_AI_AGENTS_OUTBOX_PROCESSING_TIMEOUT_MS: ${APP_AI_AGENTS_OUTBOX_PROCESSING_TIMEOUT_MS:-120000}
      APP_AI_AGENTS_OUTBOX_RETRY_BASE_DELAY_MS: ${APP_AI_AGENTS_OUTBOX_RETRY_BASE_DELAY_MS:-30000}
      APP_AI_AGENTS_OUTBOX_RETRY_MAX_DELAY_MS: ${APP_AI_AGENTS_OUTBOX_RETRY_MAX_DELAY_MS:-900000}
      APP_OPENAI_ENABLED: ${APP_OPENAI_ENABLED:-false}

      # Booking
      APP_BOOKING_CONFIRMATION_EXPIRATION_MINUTES: ${APP_BOOKING_CONFIRMATION_EXPIRATION_MINUTES:-60}
      APP_BOOKING_CONFIRMATION_EXPIRATION_SCAN_MS: ${APP_BOOKING_CONFIRMATION_EXPIRATION_SCAN_MS:-60000}
      APP_BOOKING_CONFIRMATION_PUBLIC_BASE_URL: ${APP_BOOKING_CONFIRMATION_PUBLIC_BASE_URL:-http://localhost:5173/reservas/confirmar}
      APP_BOOKING_CONFIRMATION_DISPATCH_WHATSAPP: ${APP_BOOKING_CONFIRMATION_DISPATCH_WHATSAPP:-false}
      APP_BOOKING_PAYMENT_PROVIDER: ${APP_BOOKING_PAYMENT_PROVIDER:-SIMULATED}

      # Frontend URLs
      APP_FRONTEND_PUBLIC_BASE_URL: ${APP_FRONTEND_PUBLIC_BASE_URL:-http://localhost:5173}
      APP_BOOKING_RESCHEDULE_PUBLIC_BASE_URL: ${APP_BOOKING_RESCHEDULE_PUBLIC_BASE_URL:-http://localhost:5173/reservas/reprogramar}
      APP_BOOKING_CANCELLATION_PUBLIC_BASE_URL: ${APP_BOOKING_CANCELLATION_PUBLIC_BASE_URL:-http://localhost:5173/reservas/cancelar}
      APP_BOOKING_PAYMENT_CHECKOUT_PUBLIC_BASE_URL: ${APP_BOOKING_PAYMENT_CHECKOUT_PUBLIC_BASE_URL:-http://localhost:5173/reservas/pagar}

      # Email
      APP_EMAIL_ENABLED: ${APP_EMAIL_ENABLED:-false}
      APP_EMAIL_SIMULATION_ENABLED: ${APP_EMAIL_SIMULATION_ENABLED:-true}
      APP_EMAIL_FROM: ${APP_EMAIL_FROM:-no-reply@demo.cl}
      APP_EMAIL_FROM_NAME: ${APP_EMAIL_FROM_NAME:-Centro Estetico Bella}

      # Calendar
      APP_CALENDAR_GOOGLE_ENABLED: ${APP_CALENDAR_GOOGLE_ENABLED:-false}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q UP <&3'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - asistente-local

  # ---------------------------------------------------------------------------
  # FRONTEND REACT (Vite dev server)
  # ---------------------------------------------------------------------------
  frontend-react:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
      target: dev
    container_name: asistente-frontend
    restart: unless-stopped
    depends_on:
      backend-java:
        condition: service_healthy
    environment:
      TZ: ${TZ:-America/Santiago}
      VITE_API_BASE_URL: /api/v1
      VITE_PROXY_API: http://backend-java:8080
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - asistente-local

  # ---------------------------------------------------------------------------
  # WHATSAPP WEB SERVICE (opcional: requiere --profile whatsapp)
  # ---------------------------------------------------------------------------
  whatsapp-web-service:
    profiles:
      - whatsapp
    build:
      context: ./whatsapp-web-service
      dockerfile: Dockerfile
    container_name: asistente-whatsapp-web
    restart: unless-stopped
    depends_on:
      backend-java:
        condition: service_healthy
    shm_size: "4gb"
    security_opt:
      - seccomp=unconfined
    environment:
      TZ: ${TZ:-America/Santiago}
      WHATSAPP_WEB_PORT: 3001
      WHATSAPP_WEB_API_KEY: ${WHATSAPP_WEB_API_KEY:-dev-whatsapp-web-key}
      WHATSAPP_WEB_SESSION_ID: demo-sales
      WHATSAPP_WEB_REAL_ENABLED: "true"
      WHATSAPP_WEB_AUTO_CONNECT: ${WHATSAPP_WEB_AUTO_CONNECT:-true}
      WHATSAPP_WEB_DEFAULT_PHONE_NUMBER: ${WHATSAPP_WEB_COMPANY_PHONE_NUMBER:-56900000000}
      WHATSAPP_WEB_COMPANY_PHONE_NUMBER: ${WHATSAPP_WEB_COMPANY_PHONE_NUMBER:-56900000000}
      WHATSAPP_WEB_TEST_CUSTOMER_PHONE_NUMBER: ${WHATSAPP_WEB_TEST_CUSTOMER_PHONE_NUMBER:-56950954580}
      WHATSAPP_WEB_BACKEND_WEBHOOK_URL: http://backend-java:8080/api/v1/integrations/whatsapp-web/webhook
      WHATSAPP_WEB_WEBHOOK_SECRET: ${WHATSAPP_WEB_WEBHOOK_SECRET:-dev-whatsapp-web-webhook-secret}
      WHATSAPP_WEB_SESSION_DATA_PATH: /app/.wwebjs_auth
      WHATSAPP_WEB_CACHE_PATH: /app/.wwebjs_cache
      WHATSAPP_WEB_HEADLESS: ${WHATSAPP_WEB_HEADLESS:-false}
      WHATSAPP_WEB_VISUAL_MODE: ${WHATSAPP_WEB_VISUAL_MODE:-true}
      WHATSAPP_WEB_BROWSER_VIEWER_URL: ${WHATSAPP_WEB_BROWSER_VIEWER_URL:-http://localhost:6080/vnc.html?autoconnect=true&resize=scale}
      WHATSAPP_WEB_CHROME_EXECUTABLE: /usr/bin/chromium
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      WHATSAPP_WEB_CLEAN_PROFILE_LOCKS_ON_START: "true"
      WHATSAPP_WEB_KILL_ORPHAN_CHROMIUM_ON_START: "true"
      WHATSAPP_WEB_WEB_VERSION_CACHE: "none"
      WHATSAPP_WEB_INIT_RETRIES: ${WHATSAPP_WEB_INIT_RETRIES:-5}
      WHATSAPP_WEB_INIT_RETRY_DELAY_MS: ${WHATSAPP_WEB_INIT_RETRY_DELAY_MS:-10000}
      WHATSAPP_WEB_PUPPETEER_PROTOCOL_TIMEOUT_MS: ${WHATSAPP_WEB_PUPPETEER_PROTOCOL_TIMEOUT_MS:-180000}
      WHATSAPP_WEB_PUPPETEER_TIMEOUT_MS: ${WHATSAPP_WEB_PUPPETEER_TIMEOUT_MS:-180000}
      WHATSAPP_WEB_RUNTIME_RECOVERY_DELAY_MS: ${WHATSAPP_WEB_RUNTIME_RECOVERY_DELAY_MS:-5000}
      WHATSAPP_WEB_QR_TIMEOUT_SECONDS: ${WHATSAPP_WEB_QR_TIMEOUT_SECONDS:-120}
      WHATSAPP_WEB_CHROME_EXTRA_ARGS: "--disable-features=Translate,BackForwardCache,AcceptCHFrame,MediaRouter,OptimizationHints|--disable-background-timer-throttling|--disable-backgrounding-occluded-windows|--disable-renderer-backgrounding"
    ports:
      - "3001:3001"
      - "6080:6080"
    volumes:
      - whatsapp-webjs-session-data:/app/.wwebjs_auth
      - whatsapp-webjs-cache-data:/app/.wwebjs_cache
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then((r) => { if (!r.ok) process.exit(1); return r.json(); }).then((j) => { if (j.runtimeReady !== true) process.exit(1); }).catch(() => process.exit(1))\""]
      start_period: 60s
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - asistente-local

  # ---------------------------------------------------------------------------
  # PUBLIC HTTPS TUNNEL (opcional: requiere --profile public-link)
  # ---------------------------------------------------------------------------
  public-tunnel:
    profiles:
      - public-link
    image: cloudflare/cloudflared:latest
    container_name: asistente-public-tunnel
    restart: unless-stopped
    depends_on:
      frontend-react:
        condition: service_healthy
    command: tunnel --no-autoupdate --url http://frontend-react:5173
    networks:
      - asistente-local

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres-data:

  whatsapp-webjs-session-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/.docker/volumes/whatsapp-session

  whatsapp-webjs-cache-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/.docker/volumes/whatsapp-cache
