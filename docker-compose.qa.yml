services:
  postgres:
    image: postgres:16-alpine
    container_name: asistente-whatsapp-postgres-qa
    mem_limit: 768m
    cpus: 1.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asistente_qa}
      POSTGRES_USER: ${POSTGRES_USER:-assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assistant} -d ${POSTGRES_DB:-asistente_qa}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-qa-data:/var/lib/postgresql/data

  backend-java:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: asistente-whatsapp-backend-qa
    mem_limit: 1.5g
    cpus: 1.5
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: qa
      SERVER_PORT: 8080
      TZ: ${TZ:-America/Santiago}
      APP_ENVIRONMENT: qa
      APP_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-asistente_qa}
      APP_DB_USERNAME: ${POSTGRES_USER:-assistant}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-}
      APP_ACCESS_TOKEN_EXPIRES_IN_SECONDS: ${APP_ACCESS_TOKEN_EXPIRES_IN_SECONDS:-900}
      APP_RESET_TOKEN_EXPIRES_IN_MINUTES: ${APP_RESET_TOKEN_EXPIRES_IN_MINUTES:-30}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
      APP_WHATSAPP_CHANNEL_PROVIDER: META_CLOUD_API
      APP_WHATSAPP_CLOUD_API_ENABLED: "true"
      APP_WHATSAPP_CLOUD_API_BASE_URL: ${APP_WHATSAPP_CLOUD_API_BASE_URL:-https://graph.facebook.com}
      APP_WHATSAPP_CLOUD_API_VERSION: ${APP_WHATSAPP_CLOUD_API_VERSION:-v23.0}
      APP_WHATSAPP_CLOUD_API_APP_ID: ${APP_WHATSAPP_CLOUD_API_APP_ID:-}
      APP_WHATSAPP_CLOUD_API_APP_SECRET: ${APP_WHATSAPP_CLOUD_API_APP_SECRET:-}
      APP_WHATSAPP_CLOUD_API_WEBHOOK_VERIFY_TOKEN: ${APP_WHATSAPP_CLOUD_API_WEBHOOK_VERIFY_TOKEN:-}
      APP_WHATSAPP_CLOUD_API_WEBHOOK_PUBLIC_URL: ${APP_WHATSAPP_CLOUD_API_WEBHOOK_PUBLIC_URL:-}
      APP_WHATSAPP_CLOUD_API_WEBHOOK_SIGNATURE_REQUIRED: ${APP_WHATSAPP_CLOUD_API_WEBHOOK_SIGNATURE_REQUIRED:-true}
      APP_WHATSAPP_CLOUD_API_CREDENTIAL_ENCRYPTION_SECRET: ${APP_WHATSAPP_CLOUD_API_CREDENTIAL_ENCRYPTION_SECRET:-}
      APP_WHATSAPP_CLOUD_API_PHONE_NUMBER_ID: ${APP_WHATSAPP_CLOUD_API_PHONE_NUMBER_ID:-}
      APP_WHATSAPP_CLOUD_API_BUSINESS_ACCOUNT_ID: ${APP_WHATSAPP_CLOUD_API_BUSINESS_ACCOUNT_ID:-}
      APP_WHATSAPP_CLOUD_API_ACCESS_TOKEN: ${APP_WHATSAPP_CLOUD_API_ACCESS_TOKEN:-}
      APP_WHATSAPP_CLOUD_API_DRY_RUN_ENABLED: ${APP_WHATSAPP_CLOUD_API_DRY_RUN_ENABLED:-false}
      APP_WHATSAPP_CLOUD_API_CONNECT_TIMEOUT_SECONDS: ${APP_WHATSAPP_CLOUD_API_CONNECT_TIMEOUT_SECONDS:-5}
      APP_WHATSAPP_CLOUD_API_READ_TIMEOUT_SECONDS: ${APP_WHATSAPP_CLOUD_API_READ_TIMEOUT_SECONDS:-15}
      APP_AI_AGENTS_ENABLED: "true"
      APP_AI_AGENTS_AUTO_REPLY_ENABLED: ${APP_AI_AGENTS_AUTO_REPLY_ENABLED:-true}
      APP_AI_AGENTS_SAFE_MODE_ENABLED: ${APP_AI_AGENTS_SAFE_MODE_ENABLED:-false}
      APP_AI_AGENTS_AUDIT_ENABLED: "true"
      APP_OPENAI_ENABLED: ${APP_OPENAI_ENABLED:-false}
      APP_OPENAI_API_KEY: ${APP_OPENAI_API_KEY:-}
      APP_FRONTEND_PUBLIC_BASE_URL: ${APP_FRONTEND_PUBLIC_BASE_URL:-https://qa-admin.midominio.cl}
      APP_BOOKING_CONFIRMATION_PUBLIC_BASE_URL: ${APP_BOOKING_CONFIRMATION_PUBLIC_BASE_URL:-https://qa-admin.midominio.cl/reservas/confirmar}
      APP_BOOKING_RESCHEDULE_PUBLIC_BASE_URL: ${APP_BOOKING_RESCHEDULE_PUBLIC_BASE_URL:-https://qa-admin.midominio.cl/reservas/reprogramar}
      APP_BOOKING_CANCELLATION_PUBLIC_BASE_URL: ${APP_BOOKING_CANCELLATION_PUBLIC_BASE_URL:-https://qa-admin.midominio.cl/reservas/cancelar}
      APP_BOOKING_PAYMENT_CHECKOUT_PUBLIC_BASE_URL: ${APP_BOOKING_PAYMENT_CHECKOUT_PUBLIC_BASE_URL:-https://qa-admin.midominio.cl/reservas/pagar}
      APP_BOOKING_PAYMENT_PROVIDER: ${APP_BOOKING_PAYMENT_PROVIDER:-SIMULATED}
      APP_BOOKING_PAYMENT_WEBHOOK_PUBLIC_URL: ${APP_BOOKING_PAYMENT_WEBHOOK_PUBLIC_URL:-}
      APP_MERCADOPAGO_ACCESS_TOKEN: ${APP_MERCADOPAGO_ACCESS_TOKEN:-}
      APP_EMAIL_ENABLED: ${APP_EMAIL_ENABLED:-false}
      APP_CALENDAR_ENCRYPTION_SECRET: ${APP_CALENDAR_ENCRYPTION_SECRET:-}
    ports:
      - "${BACKEND_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend-react:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_META_APP_ID: ${VITE_META_APP_ID:-}
        VITE_META_EMBEDDED_SIGNUP_CONFIG_ID: ${VITE_META_EMBEDDED_SIGNUP_CONFIG_ID:-}
        VITE_META_GRAPH_API_VERSION: ${VITE_META_GRAPH_API_VERSION:-v23.0}
    container_name: asistente-whatsapp-frontend-qa
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      backend-java:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: asistente-whatsapp-caddy-qa
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.3
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-qa-admin.midominio.cl}
    volumes:
      - ./caddy/Caddyfile.qa:/etc/caddy/Caddyfile:ro
      - caddy-qa-data:/data
    depends_on:
      backend-java:
        condition: service_healthy
      frontend-react:
        condition: service_healthy

volumes:
  postgres-qa-data:
  caddy-qa-data:
